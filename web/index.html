<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Flutter 會將 $FLUTTER_BASE_HREF 替換為 --base-href 參數值 -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- ========== SEO ========== -->
  <title>Puzzle Games — 304 Free Brain Games &amp; Logic Puzzles</title>
  <meta name="description" content="A suite of 304 minimalist puzzle games built with Flutter. Play Sudoku, 2048, Minesweeper, memory training, word puzzles and brain games free in your browser.">
  <meta name="keywords" content="puzzle games, brain games, logic puzzles, sudoku, 2048, minesweeper, memory games, word puzzles, Flutter, free online games">
  <meta name="author" content="Puzzle Games">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://vip-4.github.io/Puzzle/">

  <!-- ========== Open Graph ========== -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Puzzle Games">
  <meta property="og:title" content="Puzzle Games — 304 Free Brain Games &amp; Logic Puzzles">
  <meta property="og:description" content="304 minimalist puzzle games: Sudoku, 2048, Minesweeper, memory and word puzzles. Free to play in your browser.">
  <meta property="og:url" content="https://vip-4.github.io/Puzzle/">
  <meta property="og:image" content="https://vip-4.github.io/Puzzle/icon-512.png">
  <meta property="og:image:alt" content="Puzzle Games app icon">
  <meta property="og:locale" content="en_US">

  <!-- ========== Twitter Card ========== -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Puzzle Games — 304 Free Brain Games">
  <meta name="twitter:description" content="Sudoku, 2048, Minesweeper, memory and word puzzles. A Flutter-powered puzzle suite.">
  <meta name="twitter:image" content="https://vip-4.github.io/Puzzle/icon-512.png">

  <!-- ========== iOS / PWA ========== -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Puzzle Games">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- ========== GEO：結構化資料（便於 AI 摘要與引用） ========== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Puzzle Games",
    "description": "A suite of 304 minimalist puzzle and brain-training games built with Flutter, including Sudoku, 2048, Minesweeper, memory games and word puzzles.",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Web browser, Android, iOS, Linux, macOS, Windows",
    "url": "https://vip-4.github.io/Puzzle/",
    "inLanguage": "en",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": [
      "304 free puzzle games",
      "Logic, math, memory, word and spatial categories",
      "Offline-capable minimalist design",
      "Cross-platform Flutter build"
    ]
  }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
      }
    }
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
